<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figurine Labeler</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 210px 1fr; font: 14px system-ui, sans-serif; color: #222; background: #f5f5f3; }
  aside { background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; border-bottom: 1px solid #ddd; display: grid; gap: 8px; }
  #list { overflow: auto; flex: 1; }
  #list div { padding: 5px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list div:hover { background: #f2f2f2; }
  #list div.current { background: #dbe7ff; font-weight: 600; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; border-bottom: 1px solid #ddd; min-height: 58px; flex-wrap: wrap; }
  #title { font-weight: 600; margin-right: 6px; }
  #actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #status { color: #666; }
  button { font: inherit; padding: 7px 14px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover:not(:disabled) { background: #f2f2f2; }
  button:disabled { opacity: .45; cursor: default; }
  button.main { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.main:hover:not(:disabled) { background: #1d4ed8; }
  button.on { outline: 3px solid #93c5fd; }
  #fit { margin-left: auto; }
  #hint { padding: 6px 14px; color: #555; background: #fafaf8; border-bottom: 1px solid #e5e5e5; }
  #banner { display: none; padding: 10px 14px; background: #fff3cd; border-bottom: 1px solid #e6d28a; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #2b2b2b; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #welcome { position: absolute; inset: 0; background: #f5f5f3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 20px; text-align: center; }
  #welcome h1 { margin: 0; font-size: 24px; }
  #welcome p { margin: 0; color: #555; }
  #welcome .small { font-size: 12px; color: #888; margin-top: 10px; }
  #cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .card { width: 290px; padding: 18px; display: flex; flex-direction: column; gap: 8px; text-align: left; border-radius: 10px; }
  .card b { font-size: 16px; }
  .card span { color: #555; line-height: 1.4; }
  #where div, #zipState { color: #555; font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<aside>
  <header>
    <div id="where" hidden><b id="whereName"></b><div id="whereNote"></div></div>
    <button id="zip" class="main" hidden>⬇ Download labels</button>
    <div id="zipState"></div>
    <div id="progress"></div>
    <button id="other" hidden>Open other photos</button>
  </header>
  <div id="list"></div>
</aside>
<main>
  <div id="top">
    <span id="title"></span>
    <div id="actions"></div>
    <span id="status"></span>
    <button id="fit" title="Show the whole photo">🔍 Fit</button>
  </div>
  <div id="hint"></div>
  <div id="banner"></div>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="welcome">
      <h1>Label your photos</h1>
      <p>Your photos stay on your computer — nothing is uploaded.</p>
      <div id="cards">
        <button id="openFolder" class="card"><b>📁 Open a folder of photos</b>
          <span id="folderNote">Labels are saved automatically into a “labels” folder inside it, so you can stop and continue later. The browser will ask for permission to save there.</span></button>
        <button id="openPhoto" class="card"><b>🖼 Open a single photo</b>
          <span>When you're done, download its labels with one click (a zip file). Quick, for one photo.</span></button>
      </div>
      <p class="small">JPG or PNG photos. Chrome or Edge recommended.</p>
    </div>
  </div>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <input id="photoInput" type="file" accept="image/jpeg,image/png" hidden>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
